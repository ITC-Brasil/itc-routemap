# ============================================================
# NÃO USADO no servidor glpi-srv.
#
# Neste ambiente o TLS termina na borda do Cloudflare Tunnel, que
# entrega direto em http://localhost:3100 — não há nginx nem
# Let's Encrypt. O serviço `nginx` foi removido do docker-compose.yml.
#
# Este arquivo fica no repo de propósito: se o RouteMap voltar a ser
# publicado por um host com TLS próprio (VPS com IP público, por
# exemplo), o server block HTTPS com redirect de 80->443 já está
# pronto e validado no ensaio local.
# ============================================================

events { worker_connections 1024; }

http {
  # ============================================================
  # CERTIFICADOS TLS — o que colocar em ./nginx/certs
  # ============================================================
  #
  #   ./nginx/certs/routemap.crt   cadeia completa (fullchain): certificado do
  #                                domínio + intermediários, nessa ordem
  #   ./nginx/certs/routemap.key   chave privada, sem passphrase
  #
  # O diretório é montado em /etc/nginx/certs (bind mount read-only, ver
  # docker-compose.yml). Com Let's Encrypt/certbot os arquivos equivalentes são
  # `fullchain.pem` e `privkey.pem` — renomeie ou ajuste os caminhos abaixo.
  #
  # ⚠️ O bind mount CRIA o diretório vazio se ele não existir, o que mascara a
  # ausência dos certificados: o `docker compose up` não reclama de pasta
  # faltando, e o nginx é que morre no start com
  # "cannot load certificate ... No such file or directory". Sem os dois arquivos
  # o container não sobe — ver §10.4 do handoff, inclusive como gerar um par
  # self-signed para validar localmente antes do servidor.

  upstream nextjs { server app:3000; }

  # ============================================================
  # HTTP :80 — só redireciona
  # ============================================================
  server {
    listen 80;
    listen [::]:80;
    server_name routemap.grupoitcbrasil.com.br;

    # 301 preservando caminho e query. `$request_uri` já vem com a query string —
    # usar `$uri` aqui perderia os parâmetros, e o fluxo de OAuth do Better Auth
    # volta com eles.
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ============================================================
  # HTTPS :443
  # ============================================================
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Forma moderna, exige nginx >= 1.25.1 — o `nginx:alpine` do compose é bem
    # mais novo que isso. Se algum dia a tag for fixada numa versão anterior,
    # troque por `listen 443 ssl http2;` e remova esta linha.
    http2 on;
    server_name routemap.grupoitcbrasil.com.br;

    ssl_certificate     /etc/nginx/certs/routemap.crt;
    ssl_certificate_key /etc/nginx/certs/routemap.key;

    # TLS 1.2 e 1.3 apenas. 1.0/1.1 estão depreciados e nenhum navegador que a
    # equipe usa depende deles.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Precisa ser https aqui, não $scheme: o Next e o Better Auth montam URLs
      # absolutas a partir deste header, e com "http" o login voltaria para
      # http://… e cairia no redirect, quebrando o fluxo de OAuth.
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
