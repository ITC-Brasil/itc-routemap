version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: itc-routemap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: itc_routemap
      POSTGRES_USER: itc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itc_user -d itc_routemap"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_*: embutida no bundle do browser DURANTE o build —
        # precisa ser build arg (ARG no Dockerfile), não environment.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: itc-routemap-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://itc_user:${POSTGRES_PASSWORD}@postgres:5432/itc_routemap
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY}
      GOOGLE_SERVICE_ACCOUNT_BASE64: ${GOOGLE_SERVICE_ACCOUNT_BASE64}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-true}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: itc-routemap-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
