# ~/docker/itc-routemap/docker-compose.yml  (glpi-srv)
# Sem nginx: TLS termina no Cloudflare Tunnel -> http://localhost:3015
services:
  postgres:
    image: postgres:16-alpine
    container_name: itc-routemap-db
    restart: always
    # SEM label do Watchtower: bump automatico de major do Postgres
    # corromperia o datadir (16 -> 17 exige pg_upgrade manual).
    environment:
      POSTGRES_DB: itc_routemap
      POSTGRES_USER: itc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - itc-routemap-db-data:/var/lib/postgresql/data
    # SEM ports: acessivel apenas pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itc_user -d itc_routemap"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_*: embutidas no bundle em BUILD-time -> build arg.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL: ${NEXT_PUBLIC_SERVICE_ACCOUNT_EMAIL}
    image: itc-routemap-app:local
    container_name: itc-routemap-app
    restart: always
    # SEM label do Watchtower: imagem buildada localmente, sem registry.
    # Atualizacao e sempre `git pull && docker compose up -d --build`.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://itc_user:${POSTGRES_PASSWORD}@postgres:5432/itc_routemap
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}   # https://routemap.itcbr.xyz
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY}
      GOOGLE_SERVICE_ACCOUNT_BASE64: ${GOOGLE_SERVICE_ACCOUNT_BASE64}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NOME: ${ADMIN_NOME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3015:3000"   # so loopback; o tunnel le daqui

volumes:
  itc-routemap-db-data:
